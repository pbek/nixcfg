name: 🔎️ Check flake for all systems

on:
  push:
    branches-ignore:
      # Ignore changes to the flake update workflow, it is handled by the pull_request event
      - update_flake_lock_action
    paths-ignore:
      - "docker/**"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docker/**"

jobs:
  check:
    name: 🔎️ Eval flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host:
          - gaia
          - venus
          - rhea
          - hyperion
          - ally2
          - astra
          - caliban
          - mercury
          - sinope
          - netcup01
          - netcup02
          - home01
          - moobox01
          - jupiter
          - ally
          - pluto
          - eris
          - dp01
          - dp02
          - dp03
          - dp04
          - dp05
          - dp06
          - dp07
          - dp08
          - dp09
          - dp10
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix eval for ${{ matrix.host }}
        # We don't want to continue on error of the workflow will not fail if one host fails
        # continue-on-error: true
        run: nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath

  check-examples:
    name: 🔎️ Eval example flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        host:
          - desktop
          - server
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix eval for examples/${{ matrix.host }}
        working-directory: examples/hokage-consumer
        # Test this checkout and its nixpkgs/Home Manager pins, not the example's older locked inputs.
        run: |
          nixpkgs=$(nix flake metadata --json ../.. | jq -r '.locks as $locks | $locks.nodes[$locks.nodes[$locks.root].inputs.nixpkgs].locked | "github:\(.owner)/\(.repo)/\(.rev)"')
          home_manager=$(nix flake metadata --json ../.. | jq -r '.locks as $locks | $locks.nodes[$locks.nodes[$locks.root].inputs["home-manager"]].locked | "github:\(.owner)/\(.repo)/\(.rev)"')
          nix eval --override-input nixcfg path:../.. --override-input nixpkgs "$nixpkgs" \
            --override-input nixcfg/home-manager "$home_manager" --no-write-lock-file \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
