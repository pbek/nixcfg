name: 🏗️ Build Apps

on:
  push:
    branches:
      - main
    paths:
      - "pkgs/qownnotes/**"
      - "pkgs/nixbit/**"
      - "pkgs/sonar/**"
      - "pkgs/ziggity/**"
      - "overlays/devenv-commit.nix"
      - "overlays/sonar.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= main:WYsIaF+ItMNE9Xt976bIGKSKp9jaaVeTzYlfqQqpP28= qownnotes:7hN006Z7xgK5v97WKFo9u3qcVbZIXHtFmPPM3NPERpM=
            substituters = https://cache.nixos.org/ https://nix-cache.qownnotes.org/main https://nix-cache.qownnotes.org/qownnotes
      #      - name: Install Nix
      #        run: |
      #          curl -L https://nixos.org/nix/install | sh
      #          . $HOME/.nix-profile/etc/profile.d/nix.sh
      #      - name: Set up Nix build environment
      #        run: nix-shell '<nixpkgs>' -A haskellPackages.ghc
      #      - name: Update Nix channels
      #        run: nix-channel --update
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log-in into attic
        run: nix-shell -p attic-client --run "attic login server https://nix-cache.qownnotes.org $ATTIC_SECRET_KEY"
        env:
          ATTIC_SECRET_KEY: ${{ secrets.ATTIC_SECRET_KEY }}
      - name: Build qc flake package
        run: |
          nix build .#qc && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build qownnotes package
        run: |
          cd pkgs/qownnotes && \
          nix-build -E '((import <nixpkgs> {}).callPackage (import ./package.nix) { })' && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build qownnotes-tui flake package
        run: |
          nix build .#qownnotes-tui && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build nixbit package
        run: |
          cd pkgs/nixbit && \
          nix-build -E '((import <nixpkgs> {}).callPackage (import ./package.nix) { })' && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build nixbit flake package
        run: |
          nix build .#nixbit && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build uncrash flake package
        run: |
          nix build .#uncrash && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build tokstat flake package
        run: |
          nix build .#tokstat && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build sonar flake package
        run: |
          nix build .#sonar && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build zfsguard flake package
        run: |
          nix build .#zfsguard && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build ziggity flake package
        run: |
          nix build .#ziggity && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build devenv package
        run: |
          nix build .#devenv && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Push devenv nix-store closure to attic
        run: |
          export PATH="$(readlink -f ./result)/bin:$PATH"
          nix-shell -p attic-client --run "attic push qownnotes \$(nix-store --query --requisites \$(readlink -f \$(which devenv)) | grep -- '-nix-.*-2\.34\$') --no-closure"
      - name: Build kanboard-cli flake package
        run: |
          nix build .#kanboard-cli && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
      - name: Build lan-orangutan flake package
        run: |
          nix build .#lan-orangutan && \
          nix-shell -p attic-client --run "attic push qownnotes ./result"
